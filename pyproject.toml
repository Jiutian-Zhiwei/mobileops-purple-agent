[project]
name = "mobileops-purple-agent"
version = "1.0.0"
description = "mobileops-agent: deterministic policy-compliance purple agent for tau2-bench telecom"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "a2a-sdk[http-server]==0.3.20",
    "uvicorn>=0.38.0",
    "litellm>=1.50.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.1",
]
